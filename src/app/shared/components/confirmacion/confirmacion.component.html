<app-modal [abierto]="abierto()" [titulo]="titulo()" ancho="chico" (cerrar)="cancelar.emit()">
  <p>{{ mensaje() }}</p>
  <div pie>
    <button type="button" class="btn" (click)="cancelar.emit()">Cancelar</button>
    <button type="button" class="btn" [class.peligro]="peligro()" [class.primario]="!peligro()"
            [disabled]="procesando()" (click)="aceptar.emit()">
      {{ procesando() ? 'Procesando…' : textoAceptar() }}
    </button>
  </div>
</app-modal>
