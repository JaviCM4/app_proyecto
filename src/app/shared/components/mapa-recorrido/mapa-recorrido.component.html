<div class="mapa-recorrido">
  <div #contenedor class="mapa" [style.height.px]="alto()" [class.sin-puntos]="!tienePuntos() && !mostrarVacio()"></div>

  @if (completo()) {
    <p class="leyenda">
      <span class="punto origen">O</span> {{ origen() }}
      <span class="flecha">→</span>
      <span class="punto destino">D</span> {{ destino() }}
    </p>
  } @else if (tienePuntos()) {
    <p class="sin-mapa">{{ mensajeIncompleto() }}</p>
  } @else {
    <p class="sin-mapa">{{ mensajeVacio() }}</p>
  }
</div>
