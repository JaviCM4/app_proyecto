<div class="paginador">
  <span class="resumen">Mostrando {{ desde() }}–{{ hasta() }} de {{ total() }}</span>

  <div class="controles">
    <label class="tamano">
      Por página
      <select class="control" [value]="tamano()" (change)="alCambiarTamano($event)">
        @for (t of tamanos(); track t) {
          <option [value]="t" [selected]="t === tamano()">{{ t }}</option>
        }
      </select>
    </label>

    <button type="button" class="btn chico" [disabled]="pagina() === 1" (click)="ir(pagina() - 1)">Anterior</button>
    @for (p of paginas(); track p) {
      <button type="button" class="btn chico numero" [class.actual]="p === pagina()" (click)="ir(p)">{{ p }}</button>
    }
    <button type="button" class="btn chico" [disabled]="pagina() === totalPaginas()" (click)="ir(pagina() + 1)">Siguiente</button>
  </div>
</div>
